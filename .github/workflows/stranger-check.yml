name: stranger-check

# A machine that has never seen this project downloads the public release and walks the
# whole trust chain (docs/CHECK_YOUR_COPY.md). No checkout of this repository: everything
# comes from the release page, Hugging Face, Arweave and the Bitcoin chain. Anyone can
# press "Run workflow" and read the log. Costs nothing (GitHub-hosted runner).

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/stranger-check.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      REL: https://github.com/ericrwade/pagouro/releases/download/v1.0
      PUBKEY: RWQe8tvI6RCE2uMbuILC9/rEr6bNZdcOA+WC7dHtObLE94ovGk8xuFlG
      ZIP_SHA: 96debc3eef9ae95a1582d2b7940d227f0735ae01a2ba024bea6f2d3318b688b7
      Q8_SHA: 9336cce0647dc5a0a7346163fa45d97ec18fd9a73cb3048ebd810643f7585c05
      BLOCK: "968959"
    steps:
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign unzip jq
          pip install -q opentimestamps-client
          minisign -v; ots --version

      - name: Download the release
        run: |
          mkdir stick && cd stick
          for f in Pagouro-1.0-win64.zip Pagouro-1.0-win64.zip.sha256 MANIFEST_v1.0.md MANIFEST_v1.0.md.minisig MANIFEST_v1.0.md.ots pagouro.pub; do
            curl -sSL -o "$f" "$REL/$f"
          done
          ls -l

      - name: 1. Zip hash
        working-directory: stick
        run: |
          got=$(sha256sum Pagouro-1.0-win64.zip | cut -d' ' -f1)
          echo "zip sha256      $got"
          echo "release .sha256 $(cat Pagouro-1.0-win64.zip.sha256)"
          echo "expected (docs) $ZIP_SHA"
          [ "$got" = "$ZIP_SHA" ] && [ "$got" = "$(tr -d ' \n' < Pagouro-1.0-win64.zip.sha256)" ]
          echo "PASS zip hash"

      - name: 2. Signature (key typed from the README, not from the release)
        working-directory: stick
        run: |
          minisign -Vm MANIFEST_v1.0.md -P "$PUBKEY"
          relkey=$(grep -oE "RW[A-Za-z0-9+/=]{54}" pagouro.pub); echo "release pagouro.pub: $relkey"
          [ "$relkey" = "$PUBKEY" ]
          echo "PASS signature"

      - name: 3. Every file on the stick matches the signed manifest
        working-directory: stick
        run: |
          # the zip was written by Windows PowerShell 5.1 Compress-Archive, which stores backslash
          # separators; Info-ZIP converts them and exits 1 (warning). Other extractors may not.
          unzip -q Pagouro-1.0-win64.zip -d unpacked || [ $? -le 1 ]
          ls unpacked/model unpacked/skills | head
          cmp unpacked/MANIFEST.md MANIFEST_v1.0.md && echo "manifest in zip == signed manifest"
          cd unpacked && (python3 verify_manifest.py | tee ../verify.txt || true)
          # every file hash must check; the one expected failure is erratum E1 (the shipped
          # verifier looks for minisign.pub, the stick ships pagouro.pub) — docs/ERRATA_v1.0.md
          grep -q "115 of 115 listed files present, 1 mismatched, 0 missing, 0 extra" ../verify.txt
          grep -q "SIGNATURE FAILED: minisign.pub: No such file" ../verify.txt
          ! grep -q "^MISMATCH\|^MISSING\|^EXTRA" ../verify.txt
          minisign -Vm MANIFEST.md -p pagouro.pub
          echo "PASS manifest"

      - name: 4. Timestamp on Bitcoin (proof vs. the chain, no node needed)
        working-directory: stick
        run: |
          ots info MANIFEST_v1.0.md.ots | tail -3
          ots --no-bitcoin verify MANIFEST_v1.0.md.ots 2>&1 | tee ots_verify.txt || true
          # the proof names one or more blocks and the merkle root each must carry; ask the chain
          n=0
          while read -r blk root; do
            hash=$(curl -sS "https://blockstream.info/api/block-height/$blk")
            chain=$(curl -sS "https://blockstream.info/api/block/$hash" | jq -r .merkle_root)
            echo "block $blk  proof says $root"
            echo "block $blk  chain says $chain"
            [ "$root" = "$chain" ]
            n=$((n+1))
          done < <(grep -oE 'block [0-9]+ has merkleroot [0-9a-f]{64}' ots_verify.txt | awk '{print $2, $5}')
          [ "$n" -ge 1 ] && grep -q "block $BLOCK has merkleroot" ots_verify.txt
          echo "PASS timestamp ($n attestation(s), block $BLOCK among them)"

      - name: 5. Hugging Face weights match the manifest (LFS sha256 from the API)
        run: |
          hf=$(curl -sS "https://huggingface.co/api/models/Pagouro/pagouro-1.0/tree/main" | jq -r '.[] | select(.path=="pagouro-1b-q8_0.gguf") | .lfs.oid')
          echo "HF  pagouro-1b-q8_0.gguf $hf"
          echo "man pagouro-q8_0.gguf $Q8_SHA"
          [ "$hf" = "$Q8_SHA" ]
          echo "PASS hugging face"

      - name: 6. Arweave copy of the manifest and signature match
        working-directory: stick
        run: |
          curl -sSL -o ar_manifest.md https://arweave.net/RVpjbcNsXcsIJgStjWvLp5pSFuUu_gqew9ONiB4NNdk
          curl -sSL -o ar_sig https://arweave.net/Z-UZLzRPcuqYaHsYflabNPNchIU9gTdjRA1x6-UjNvY
          cmp ar_manifest.md MANIFEST_v1.0.md && cmp ar_sig MANIFEST_v1.0.md.minisig
          minisign -Vm ar_manifest.md -x ar_sig -P "$PUBKEY"
          echo "PASS arweave"

      - name: Verdict
        run: echo "STRANGER CHECK PASSED — zip, signature, manifest, Bitcoin block $BLOCK, Hugging Face, Arweave all agree."
